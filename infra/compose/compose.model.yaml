# Overlay: use a local model server running on the host (Ollama by default).
# Start it with `ollama serve` (binds 127.0.0.1:11434). Data never leaves this machine.
x-local-model: &local-model
  TRACE_MODEL_PROVIDER: local
  TRACE_MODEL_NAME: ${TRACE_MODEL_NAME:-qwen2.5:7b-instruct}
  TRACE_MODEL_BASE_URL: ${TRACE_MODEL_BASE_URL:-http://host.docker.internal:11434/v1}
  TRACE_EMBEDDING_PROVIDER: ollama
  TRACE_EMBEDDING_BASE_URL: ${TRACE_EMBEDDING_BASE_URL:-http://host.docker.internal:11434/v1}

services:
  api:
    environment: *local-model
    extra_hosts: ["host.docker.internal:host-gateway"]
  worker:
    environment: *local-model
    extra_hosts: ["host.docker.internal:host-gateway"]
