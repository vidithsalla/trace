[project]
name = "trace-api"
version = "0.1.0"
description = "Trace - Sovereign Discovery Copilot API"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14.0",
  "argon2-cffi>=23.1.0",
  "boto3>=1.37.0",
  "dramatiq[redis]>=1.17.0",
  "email-validator>=2.2.0",
  "fastapi>=0.115.0",
  "itsdangerous>=2.2.0",
  "openpyxl>=3.1.5",
  "pgvector>=0.3.6",
  "pydantic-settings>=2.7.0",
  "pymupdf>=1.25.0",
  "psycopg[binary]>=3.2.0",
  "python-docx>=1.1.2",
  "python-multipart>=0.0.20",
  "redis>=5.2.1",
  "sqlalchemy>=2.0.36",
  "structlog>=24.4.0",
  "uvicorn[standard]>=0.34.0"
]

[project.optional-dependencies]
semantic = [
  "sentence-transformers>=3.4.0"
]

[dependency-groups]
dev = [
  "httpx>=0.28.1",
  "pytest>=8.3.4",
  "pytest-asyncio>=0.25.0",
  "ruff>=0.9.9"
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
# B008: FastAPI's Depends()/File() defaults are the framework idiom, not a bug.
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
pythonpath = ["."]
